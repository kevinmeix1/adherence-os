name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production demo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install model runtime
        run: python -m pip install -r requirements-model.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Reproduce model artifact
        run: pnpm check:model

      - name: Run tests
        run: pnpm test

      - name: Build production app
        run: pnpm build

      - name: Check home bundle budget
        run: pnpm check:bundle

      - name: Smoke production app
        shell: bash
        run: |
          pnpm start > /tmp/adherence-os.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              cat /tmp/adherence-os.log
              exit 1
            fi

            sleep 1
          done

          pnpm smoke
